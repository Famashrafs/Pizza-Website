# Render Blueprint — free-tier demo order API.
#
# Create the service from the Render dashboard: New → Blueprint → pick this
# repo, or manually: New → Web Service with the settings below. The free plan
# requires no payment method. Secrets are marked `sync: false` so Render prompts
# for them instead of reading them from this file.
#
# Root directory stays at the repository root so the service can reuse the
# SHARED order engine in functions/lib/ (no duplicated pricing logic).
services:
  - type: web
    name: pizza-demo-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm --prefix server install
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DEMO_MODE
        value: demo
      # Comma-separated browser origins (Vercel URL + local dev).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Full Firebase service-account JSON as a single-line string (secret).
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
